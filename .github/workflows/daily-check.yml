name: Check Oposiciones Daily

on:
  schedule:
    # Se ejecuta cada díƒa a las 8:00 UTC (10:00 hora Espaí¿½a)
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  check-oposiciones:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml
      
      - name: Run oposiciones checker
        run: python scripts/check-oposiciones.py
      
      - name: Commit and push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/oposiciones.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update oposiciones data - $(date +%Y-%m-%d)"
            git push
          fi
